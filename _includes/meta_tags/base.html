<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% if page.subtitle and page.subtitle != '' %} — {{ page.subtitle }}{% endif %}{% endif %} · {{ site.title }}</title>
<meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
{% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon-blue.svg?v=3' | prepend: site.baseurl }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon-blue.svg?v=3' | prepend: site.baseurl }}">
<link rel="mask-icon" href="{{ '/assets/images/favicon-blue.svg?v=3' | prepend: site.baseurl }}" color="#27A9E1">
